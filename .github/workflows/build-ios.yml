name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ios-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Remove dev-only dependencies for production build
        run: pnpm remove expo-dev-client

      - name: Regenerate inline reader assets
        run: node scripts/generate-reader-inline-assets.cjs

      - name: Generate env file
        run: node scripts/generate-env-file.cjs --build-type Release

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Patch Podfile for Google Sign-In compatibility
        working-directory: ios
        run: |
          sed -i '' '1s/^/use_modular_headers!\n/' Podfile

      - name: Install Pods
        working-directory: ios
        run: pod install --repo-update

      - name: Build app (unsigned, simulator)
        working-directory: ios
        run: |
          set -ex
          xcodebuild \
            -workspace LNReader.xcworkspace \
            -scheme LNReader \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Smoke test app launch on simulator
        run: |
          set -ex
          APP_PATH=$(find ios/build/Build/Products/Release-iphonesimulator -name "*.app" -maxdepth 1 | head -1)
          echo "APP_PATH=$APP_PATH"
          # Pick an available *iPhone* simulator (watchOS/tvOS can't run iOS apps).
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); devs=[dev for runtime,devices in d["devices"].items() for dev in devices if dev["isAvailable"] and "iPhone" in dev.get("name","")]; print(devs[0]["udid"])')
          echo "Booting simulator $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          # Launch with console attached: captures Hermes/RN stdout+stderr
          # (console.log, JS exceptions, native errors) which log show misses.
          (timeout 25 xcrun simctl launch --console-pty "$DEVICE_ID" com.rajarsheechatterjee.LNReader 2>&1 || true) | tee /tmp/smoke-console.txt | tail -60
          echo "--- CONSOLE END ---"
          # Screenshot the simulator so we can SEE what the app shows.
          xcrun simctl io "$DEVICE_ID" screenshot /tmp/smoke-screen.png || true
          echo "--- SCREENSHOT: /tmp/smoke-screen.png ---"
          mkdir -p /tmp/smoke-artifacts
          cp /tmp/smoke-console.txt /tmp/smoke-artifacts/ 2>/dev/null || true
          cp /tmp/smoke-screen.png /tmp/smoke-artifacts/ 2>/dev/null || true

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: /tmp/smoke-artifacts/
          retention-days: 7

      - name: Build app (unsigned, device)
        working-directory: ios
        run: |
          set -ex
          xcodebuild \
            -workspace LNReader.xcworkspace \
            -scheme LNReader \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build-device \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Package IPA
        run: |
          set -ex
          APP_PATH=$(find ios/build-device/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found"
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          mkdir -p "Payload/LNReader.app/assets/reader"
          cp -r assets/reader/css "Payload/LNReader.app/assets/reader/" 2>/dev/null || true
          cp -r assets/reader/js "Payload/LNReader.app/assets/reader/" 2>/dev/null || true
          cp -r assets/reader/fonts "Payload/LNReader.app/assets/reader/" 2>/dev/null || true
          find Payload/LNReader.app/assets/reader -type f | head -5
          zip -r LNReader-ios-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LNReader-ios-unsigned
          path: LNReader-ios-unsigned.ipa
          retention-days: 30